services:
  mysql:
    image: mysql:8.4
    container_name: ersync-mysql-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ersync
      MYSQL_USER: ersync_local
      MYSQL_PASSWORD: ersync_local_password
      MYSQL_ROOT_PASSWORD: ersync_root_password
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - ersync-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ersync-mysql-data:
