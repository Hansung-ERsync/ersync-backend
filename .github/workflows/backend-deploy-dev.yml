name: Backend Dev Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: backend-dev-deploy
    cancel-in-progress: false

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Run tests
              run: ./gradlew clean check

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image
              id: build-image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  set -Eeuo pipefail
                  image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                  docker build --tag "${image_uri}" .
                  docker push "${image_uri}"
                  echo "image_uri=${image_uri}" >> "${GITHUB_OUTPUT}"
                  echo "Pushed ${image_uri}"

            - name: Deploy image to EC2
              env:
                  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
                  IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
              run: |
                  set -Eeuo pipefail

                  script_payload="$(base64 < scripts/deploy-ec2.sh | tr -d '\n')"
                  deploy_command="printf '%s' '${script_payload}' | base64 --decode > /usr/local/bin/ersync-deploy && chmod 700 /usr/local/bin/ersync-deploy && /usr/local/bin/ersync-deploy '${IMAGE_URI}' '${AWS_REGION}'"
                  parameters_file="$(mktemp)"
                  result_file="$(mktemp)"
                  trap 'rm -f "${parameters_file}" "${result_file}"' EXIT

                  jq -n \
                      --arg command "${deploy_command}" \
                      '{commands: [$command], executionTimeout: ["600"]}' \
                      > "${parameters_file}"

                  command_id="$(
                      aws ssm send-command \
                          --document-name "AWS-RunShellScript" \
                          --instance-ids "${EC2_INSTANCE_ID}" \
                          --parameters "file://${parameters_file}" \
                          --timeout-seconds 60 \
                          --comment "Deploy ersync-api ${GITHUB_SHA}" \
                          --query "Command.CommandId" \
                          --output text
                  )"

                  echo "SSM command: ${command_id}"

                  status="Pending"
                  for attempt in $(seq 1 132); do
                      status="$(
                          aws ssm get-command-invocation \
                              --command-id "${command_id}" \
                              --instance-id "${EC2_INSTANCE_ID}" \
                              --query "Status" \
                              --output text 2>/dev/null || true
                      )"

                      case "${status}" in
                          Success|Cancelled|Failed|TimedOut)
                              break
                              ;;
                      esac

                      sleep 5
                  done

                  aws ssm get-command-invocation \
                      --command-id "${command_id}" \
                      --instance-id "${EC2_INSTANCE_ID}" \
                      --query '{
                          Status: Status,
                          StandardOutputContent: StandardOutputContent,
                          StandardErrorContent: StandardErrorContent
                      }' \
                      --output json > "${result_file}"

                  jq -r '
                      "SSM status: \(.Status)",
                      .StandardOutputContent,
                      .StandardErrorContent
                  ' "${result_file}"

                  if [[ "${status}" != "Success" ]]; then
                      echo "EC2 deployment failed with status: ${status}" >&2
                      exit 1
                  fi
