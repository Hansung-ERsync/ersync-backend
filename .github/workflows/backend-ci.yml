name: Backend CI

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Run tests
              run: ./gradlew clean check

            - name: Build Docker image
              run: docker build --tag ersync-api:pr-${{ github.event.pull_request.number }} .
