spring:
  application:
    name: ersync
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - db

ersync:
  assessment:
    active-protocol-version: ERSYNC_MVP_1.0
    pre-ktas-standard-version: DEV_UNCONFIRMED
  auth:
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    jwt-issuer: ersync
    jwt-secret-base64: ${ERSYNC_JWT_SECRET_BASE64:}
  bootstrap:
    super-admin:
      enabled: ${ERSYNC_SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      login-id: ${ERSYNC_SUPER_ADMIN_LOGIN_ID:}
      password: ${ERSYNC_SUPER_ADMIN_PASSWORD:}
  build:
    commit-sha: ${ERSYNC_GIT_SHA:local}
  cors:
    allowed-origins: ${ERSYNC_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  hospital-search:
    scheduler-enabled: true
    scheduler-fixed-delay: PT1S
    initial-radius-km: 10
    minimum-candidate-count: 3
    radius-increment-km: 10
    maximum-radius-km: 100
    response-window: PT60S
  location:
    stale-after: PT30S
  maps:
    naver:
      enabled: ${ERSYNC_NAVER_MAPS_ENABLED:false}
      eta-scheduler-enabled: true
      eta-scheduler-fixed-delay: PT1S
      base-url: https://maps.apigw.ntruss.com
      client-id: ${ERSYNC_NAVER_MAPS_CLIENT_ID:}
      client-secret: ${ERSYNC_NAVER_MAPS_CLIENT_SECRET:}
      connect-timeout: PT2S
      read-timeout: PT3S
      maximum-attempts: 3
      retry-delay: PT5S
      claim-lease: PT15S
  privacy:
    contact-sharing-consent-version: CONTACT_SHARING_DEV_1.0
    collection-use-consent-version: COLLECTION_USE_DEV_1.0
    hospital-provision-consent-version: HOSPITAL_PROVISION_DEV_1.0
  realtime:
    scheduler-enabled: true
    outbox-fixed-delay: PT1S
    outbox-claim-lease: PT10S
    outbox-retry-delay: PT3S
    heartbeat-delay: PT15S
